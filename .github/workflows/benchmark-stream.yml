name: Composed stream measurement

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stream-measurement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: Full composed stream measurement
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.4
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Verify toolchain and install dependencies
        run: |
          test "$(node --version)" = v24.22.1
          test "$(pnpm --version)" = 11.28.4
          pnpm install --frozen-lockfile

      - name: Check
        timeout-minutes: 20
        run: pnpm check

      - name: Measure all 24 cells
        id: measure
        timeout-minutes: 14
        run: node scripts/benchmark-stream.mjs > "$RUNNER_TEMP/stream-benchmark.json"

      - name: Validate report and source identity
        id: report
        if: ${{ always() && steps.measure.outcome != 'skipped' }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { appendFileSync, readFileSync, statSync } from "node:fs";
          import { join } from "node:path";

          const path = join(process.env.RUNNER_TEMP, "stream-benchmark.json");
          assert.ok(statSync(path).size <= 2 * 1024 * 1024, "report exceeds 2 MiB");
          const report = JSON.parse(readFileSync(path, "utf8"));
          // Retain bounded JSON even when sample validity or identity checks fail.
          appendFileSync(process.env.GITHUB_OUTPUT, "bounded=true\n");
          assert.equal(report.schema, 1);
          assert.equal(report.cancelled, false);
          assert.equal(report.plannedSamples, 24);
          assert.equal(report.validSamples, 24);
          assert.equal(report.invalidSamples, 0);
          assert.equal(report.cells.length, 24);
          const harnessSha256 = createHash("sha256")
            .update(readFileSync("scripts/benchmark-stream.mjs"))
            .digest("hex");
          const scenarios = ["live", "replay", "drop-oldest", "disconnect"];
          const build = report.cells[0].measurement.provenance;
          assert.match(build.buildSha256, /^[a-f0-9]{64}$/);
          assert.ok(build.buildFiles.includes("stream.js"));
          for (const [order, cell] of report.cells.entries()) {
            const repetition = Math.floor(order / 8);
            const arms = repetition % 2 === 0 ? ["direct", "batched"] : ["batched", "direct"];
            assert.equal(cell.order, order);
            assert.equal(cell.repetition, repetition);
            assert.deepEqual(cell.workload, {
              scenario: scenarios[Math.floor((order % 8) / 2)],
              arm: arms[order % 2],
              rounds: 64,
              chunkBytes: 1024,
            });
            assert.deepEqual(cell.source, { sourceCommit: process.env.GITHUB_SHA, sourceDirty: false });
            assert.equal(cell.outcome, "success");
            assert.deepEqual(cell.exit, { code: 0, signal: null });
            for (const key of ["valid", "childReaped", "parityValid", "cleanupValid", "resourceAccountingValid"]) {
              assert.equal(cell[key], true, `cell ${order}: ${key}`);
            }
            const provenance = cell.measurement.provenance;
            assert.equal(provenance.node, "v24.22.1");
            assert.equal(provenance.platform, "linux");
            assert.equal(provenance.arch, "x64");
            assert.equal(provenance.packageManager, "pnpm@11.28.4");
            assert.equal(provenance.harnessSha256, harnessSha256);
            assert.equal(provenance.buildSha256, build.buildSha256);
            assert.deepEqual(provenance.buildFiles, build.buildFiles);
          }
          console.log("Validated 24 full cells with matching source, build, and toolchain identities.");
          NODE

      - name: Upload bounded report
        if: ${{ always() && steps.report.outputs.bounded == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stream-benchmark-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stream-benchmark.json
          if-no-files-found: error
          retention-days: 7
